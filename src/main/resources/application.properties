spring.application.name=ai-quota-proxy-backend
server.port=${PORT:8080}

app.time-zone=America/Bogota
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://ai-quota-proxy-frontend*.vercel.app}
app.demo.enabled=${APP_DEMO_ENABLED:true}

spring.datasource.url=jdbc:h2:mem:aiquota;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
